# Production stack for Coolify ("Docker Compose" build pack → compose file: /docker-compose.prod.yml).
#
#   web  — the only public service; give it the domain in Coolify (https://your-domain:3000).
#          Serves the app and forwards /api/* to the API over the internal network.
#   api  — FastAPI; runs migrations + reference-data seed on every start. Not exposed.
#   db   — PostgreSQL 16 with a persistent volume. Not exposed.
#
# Secrets are generated by Coolify (SERVICE_PASSWORD_*) and kept across deploys.
# Set in Coolify → Environment Variables: WEB_APP_URL (required), OPENROUTER_API_KEY, GITHUB_*.
# After the first deploy, in the api container terminal:
#   career-os user add you@example.com && career-os jobs sync

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: career_os
      POSTGRES_USER: career_os
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_os -d career_os"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    logging: *logging

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://career_os:${SERVICE_PASSWORD_POSTGRES}@db:5432/career_os
      TOKEN_ENCRYPTION_KEY: ${SERVICE_PASSWORD_64_TOKENKEY}
      WEB_APP_URL: ${WEB_APP_URL:?set WEB_APP_URL, e.g. https://career.example.com}
      SESSION_COOKIE_SECURE: "true"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-openai/gpt-4o-mini}
      LLM_FAST_MODEL: ${LLM_FAST_MODEL:-}
      LLM_TASK_MODELS: ${LLM_TASK_MODELS:-}
      LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-2.0}            # all users together, per UTC day
      LLM_USER_DAILY_BUDGET_USD: ${LLM_USER_DAILY_BUDGET_USD:-0.5}
      JOB_SYNC_INTERVAL_HOURS: ${JOB_SYNC_INTERVAL_HOURS:-6}        # company boards refresh
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-}                  # ${WEB_APP_URL}/api/oauth/github/callback
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - uploads:/app/personal                                        # uploaded CVs
    mem_limit: 768m
    logging: *logging

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        API_URL: http://api:8000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
    expose:
      - "3000"
    mem_limit: 384m
    logging: *logging

volumes:
  pgdata:
  uploads:

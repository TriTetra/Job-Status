# Company career boards CareerOS reads directly (careeros/jobs/boards.py).
# Postings link straight to the company's own page — you apply there.
#
# Add a company: find its board on the careers page URL and add one line.
# `domain` (the company's website) is used for its logo.
#   greenhouse  boards.greenhouse.io/<board>  or  job-boards.greenhouse.io/<board>
#   lever       jobs.lever.co/<board>
#   ashby       jobs.ashbyhq.com/<board>
#   workday     <tenant>.wdN.myworkdayjobs.com/<site>   → host, tenant, site
#   personio    <board>.jobs.personio.de (host for .com) · recruitee <board>.recruitee.com
#   workable    apply.workable.com/<board> · smartrecruiters jobs.smartrecruiters.com/<board>
#   eightfold   <host>/careers → host, board (the domain), search: [locations]
# Boards linked from the job feeds (careeros/jobs/feeds.py) are added automatically
# to the discovered_boards table; this file is the hand-picked list.
# Check it with:  career-os jobs sync --company <key> --dry-run
#
# Every board here answered with open jobs on 2026-10-28.

# Only postings whose title matches are stored. Users' target roles (Settings →
# preferences) are added to `include` automatically.
titles:
  include:
    - engineer
    - engineering
    - developer
    - software
    - data
    - machine learning
    - ML
    - AI
    - scientist
    - research
    - SRE
    - site reliability
    - devops
    - platform
    - infrastructure
    - security
    - architect
    - backend
    - frontend
    - full stack
    - fullstack
    - mobile
    - iOS
    - Android
    - cloud
    - analytics
    # Specialities whose titles carry none of the words above. A quoted term
    # is an exact phrase; otherwise its words may come in any order.
    - researcher
    - applied science
    - deep learning
    - computer vision
    - NLP
    - LLM
    - MLOps
    - DataOps
    - business intelligence
    - BI
    - insights analyst
    - statistician
    - database
    - DBA
    - system administrator
    - systems administrator
    - sysadmin
    - '"tech lead"'
    - '"technical lead"'
    - CTO
    - chief technology
    - SDET
    - test automation
    - '"member of technical staff"'
    - cybersecurity
    # German, French, Spanish, Italian, Dutch, Polish titles (Adzuna and EU boards)
    - Entwickler
    - Entwicklerin
    - Softwareentwickler
    - Softwareentwicklerin
    - Softwareingenieur
    - Informatiker
    - Informatikerin
    - Architekt
    - Architektin
    - Systemadministrator
    - Applikationsentwickler
    - Anwendungsentwickler
    - IT Spezialist
    - Datenwissenschaftler
    - Développeur
    - Développeuse
    - Ingénieur
    - Ingénieure
    - Desarrollador
    - Desarrolladora
    - Ingeniero
    - Ingeniera
    - Programador
    - Sviluppatore
    - Sviluppatrice
    - Ingegnere
    - Ontwikkelaar
    - Programista
    - Inżynier
    # Turkish titles (whole words: suffixed forms are listed too)
    - Yazılım
    - Mühendis
    - Mühendisi
    - Geliştirici
    - Geliştiricisi
    - Veri
    - Yapay Zeka
    - Makine Öğrenmesi
    - Analist
    - Analisti
    - Yazılımcı
    - Mühendisliği
  exclude:
    - recruiter
    - recruiting
    - sourcer
    - account executive
    - account manager
    - counsel
    - attorney
    - paralegal
    - accountant
    - payroll
    - executive assistant

# Workday has no cheap "list everything": search server-side for these terms
workday_search: [software, engineer, data, machine learning]


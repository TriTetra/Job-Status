# Company career boards CareerOS reads directly (careeros/jobs/boards.py).
# Postings link straight to the company's own page — you apply there.
#
# Add a company: find its board on the careers page URL and add one line.
#   greenhouse  boards.greenhouse.io/<board>  or  job-boards.greenhouse.io/<board>
#   lever       jobs.lever.co/<board>
#   ashby       jobs.ashbyhq.com/<board>
#   workday     <tenant>.wdN.myworkdayjobs.com/<site>   → host, tenant, site
# Check it with:  career-os jobs sync --company <key> --dry-run
#
# Every board here answered with open jobs on 2026-10-28.

# Only postings whose title matches are stored. Users' target roles (Settings →
# preferences) are added to `include` automatically.
titles:
  include:
    - engineer
    - engineering
    - developer
    - software
    - data
    - machine learning
    - ML
    - AI
    - scientist
    - research
    - SRE
    - site reliability
    - devops
    - platform
    - infrastructure
    - security
    - architect
    - backend
    - frontend
    - full stack
    - fullstack
    - mobile
    - iOS
    - Android
    - cloud
    - analytics
  exclude:
    - recruiter
    - recruiting
    - sourcer
    - account executive
    - account manager
    - counsel
    - attorney
    - paralegal
    - accountant
    - payroll
    - executive assistant

# Workday has no cheap "list everything": search server-side for these terms
workday_search: [software, engineer, data, machine learning]


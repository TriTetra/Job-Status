# =============================================================================
# Skill Graph — knowledge/v1/skills/skill_graph.yaml
#
# This is the single source of truth for all skill metadata.
# Nothing in Python code should hardcode skill names, topics, or edges.
#
# Schema per skill:
#   category:        language | framework | ml | infra | database | tool
#   github_topics:   GitHub repo topics that map to this skill
#   github_languages: GitHub repo.language values that map to this skill
#   aliases:         Alternative names / job-posting keywords (case-insensitive match)
#   transfers_to:    {SkillName: weight} — transfer learning edges (0.0–1.0)
#                    0.9+ nearly identical, 0.7-0.9 strong, 0.5-0.7 moderate,
#                    0.3-0.5 weak, <0.3 minimal
# =============================================================================


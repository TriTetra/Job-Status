version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: career-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: career_os
      POSTGRES_USER: career_os
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-career_os_dev}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_os -d career_os"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - career-os-network

  adminer:
    image: adminer:latest
    container_name: career-os-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_USER: career_os
      ADMINER_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD:-career_os_dev}
      ADMINER_DEFAULT_DB: career_os
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - career-os-network

volumes:
  postgres_data:
    driver: local

networks:
  career-os-network:
    driver: bridge

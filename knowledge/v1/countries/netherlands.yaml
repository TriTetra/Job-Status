  salary_threshold_eur: 46107
  highly_skilled_migrant_threshold_eur: 46107
  shortage_occupations: [Software Engineer, Data Engineer, ML Engineer, Semiconductor]
  processing_time_months: "2-4"
  path_to_pr_years: 5
  notes: "30% tax ruling saves significant tax for first 5 years."
  thirty_pct_ruling: true

tax:
  income_tax_range: "36.97%-49.5%"
  effective_single_80k_with_30pct_pct: 22
  effective_single_80k_without_30pct_pct: 38
  thirty_pct_ruling_benefit: "30% of salary tax-free for 5 years for expats"
  notes: "30% ruling is the biggest benefit for international hires."

work_culture:
  vacation_days: 25
  remote_friendly: high
  notice_period_months: 1
  work_hours_per_week: 40
  overtime_culture: very_low
  hierarchy: very_flat
  directness: very_high

pros:
  - 30% tax ruling saves 15-20k EUR/year for 5 years
  - English is the working language everywhere
  - Excellent work-life balance (Dutch culture)
  - Central EU location, easy travel
  - EU Blue Card path to long-term residency

cons:
  - Very expensive housing in Amsterdam
  - High income tax without 30% ruling
  - Bureaucratic IND (immigration) process
  - Dutch language needed for full integration
  - 30% ruling expires after 5 years (tax cliff)


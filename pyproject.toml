# One installable package for the whole Python side of the repo.
# Setup (once per venv):   pip install -r requirements-dev.txt && pip install -e .
# After that every module is importable as core.*, services.*, plugins.*,
# shared.*, apps.cli.*, apps.api.app.* — from any directory, with no sys.path tweaks.
#   API:  uvicorn apps.api.app.main:app --reload --port 8000
#   CLI:  career-os <command>

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "careeros"
version = "0.1.0"
description = "Self-hosted career intelligence stack"
requires-python = ">=3.11"

[project.scripts]
career-os = "apps.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "core*", "services*", "plugins*", "apps*"]
namespaces = false

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.j2", "*.md"]

# ── pytest ────────────────────────────────────────────────────────────────
# Default run = fast, offline tests (tests/unit + tests/smoke).
# Live tests (DB / network / LLM) live in tests/integration and only run with:
#   pytest -m integration
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
timeout = 120
markers = [
    "integration: needs a live database, network or LLM (run with -m integration)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ── ruff ──────────────────────────────────────────────────────────────────
# Start narrow: only rules that catch real breakage (syntax errors, undefined
# names, unused imports/variables). Widen the rule set as modules get cleaned.
[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    "_archive",
    "venv",
    "services/hiring-agent",  # vendored third-party tool
    "core/db/migrations/versions",
]

[tool.ruff.lint]
select = ["E9", "F"]
